<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discard this draft? — Kynvera confirmation prompts</title>
  <style>
:root {
  --accent: #ff8e68;
  --accent-2: #ff7a50;
  --text: #191b23;
  --muted: #5c616e;
  --danger: #dc2626;
  --danger-hover: #b91c1c;
  --bg: #e8eaef;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:
    linear-gradient(180deg, rgba(25,27,35,.28), rgba(25,27,35,.45)),
    repeating-linear-gradient(-12deg, #f4f5f7 0 18px, #eceef2 18px 36px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
.card {
  width: min(360px, calc(100vw - 2rem));
  background: #fff;
  border-radius: 14px;
  border: 1px solid #ececef;
  box-shadow: 0 10px 32px rgba(25, 27, 35, 0.18);
  overflow: hidden;
}
.card-header {
  margin: 0;
  padding: 0.95rem 1.2rem;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  font-size: 1.02rem;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.card-body {
  margin: 0;
  padding: 1rem 1.2rem 0.15rem;
  font-size: 0.9rem;
  font-weight: 450;
  line-height: 1.5;
  color: var(--muted);
  white-space: pre-wrap;
}
.card-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.35rem;
  padding: 0.95rem 1.2rem 1.05rem;
}
.btn {
  appearance: none;
  border: none;
  background: transparent;
  cursor: default;
  font-family: inherit;
  font-size: 0.84rem;
  font-weight: 600;
  min-height: 36px;
  padding: 0.4rem 0.95rem;
  border-radius: 9px;
}
.btn-cancel { color: var(--muted); }
.btn-ok {
  background: var(--accent);
  color: #fff;
  font-weight: 650;
}
.btn-danger {
  background: var(--danger);
  color: #fff;
  font-weight: 650;
}
.meta {
  position: fixed;
  left: 1rem;
  bottom: 1rem;
  font-size: 0.72rem;
  color: rgba(255,255,255,.85);
  text-shadow: 0 1px 2px rgba(0,0,0,.35);
  max-width: calc(100vw - 2rem);
}
.meta a { color: #fff; }
</style>
</head>
<body>
  <article class="card"><h1 class="card-header">Discard this draft?</h1><p class="card-body">Discard this draft? It will be marked cancelled and will not become an active ticket.</p><div class="card-actions"><button type="button" class="btn btn-cancel">Cancel</button><button type="button" class="btn btn-danger">OK</button></div></article>
  <p class="meta">ticketing · native · module_ticketing/templates/ticket_new.html</p>
</body>
</html>
